# Construye y publica el sitio en GitHub Pages.
#
# Se ejecuta solo cada vez que subes algo a la rama main (por ejemplo
# fotos nuevas) y también puedes lanzarlo a mano desde la pestaña
# "Actions" del repositorio.
#
# IMPORTANTE (una sola vez): en Settings -> Pages -> "Build and
# deployment" -> Source, elige **GitHub Actions**.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cachea las miniaturas ya generadas: los despliegues siguientes
      # solo procesan las fotos nuevas.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: img-cache-${{ hashFiles('photos/**') }}
          restore-keys: img-cache-

      # ffmpeg: optimiza los vídeos (.mov/.mp4) a un formato web ligero.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
